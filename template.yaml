AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: In Game Now Notifications - League of Legends game alerts and post-game stats.

Parameters:
  RiotApiKeySecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret that holds the Riot API key.
  SesSenderEmail:
    Type: String
    Description: Verified SES identity used as the notification sender.
  RecipientEmail:
    Type: String
    Description: Email address that receives game notifications and alarms.
  DiscordWebhookUrl:
    Type: String
    NoEcho: true
    Default: ""
    Description: Discord webhook URL; Discord notifications are skipped when empty.
  MatchRegion:
    Type: String
    Default: americas
    AllowedValues:
      - americas
      - europe
      - asia
    Description: Regional route for Account-V1 and Match-V5.
  RiotRegion:
    Type: String
    Default: na1
    Description: Platform region for Spectator-V5 (for example na1, euw1, kr).

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 128
    Tracing: Active

Resources:
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-notifications"

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alarms"

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref RecipientEmail

  PlayersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-players"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: playerId
          AttributeType: S
      KeySchema:
        - AttributeName: playerId
          KeyType: HASH

  GameStatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-game-stats"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: matchId
          AttributeType: S
        - AttributeName: puuid
          AttributeType: S
      KeySchema:
        - AttributeName: matchId
          KeyType: HASH
        - AttributeName: puuid
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  StatsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-stats-dlq"
      MessageRetentionPeriod: 1209600

  DetectionDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-detection-dlq"

  GameLifecycleStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-game-lifecycle"
      Type: STANDARD
      Tracing:
        Enabled: true
      DefinitionSubstitutions:
        NotificationTopicArn: !Ref NotificationTopic
        GetGameStatsFunctionArn: !GetAtt GetGameStatsFunction.Arn
        StatsDeadLetterQueueUrl: !Ref StatsDeadLetterQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref NotificationTopic
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt StatsDeadLetterQueue.Arn
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt GetGameStatsFunction.Arn
      Definition:
        StartAt: PublishAlert
        States:
          PublishAlert:
            Type: Task
            Resource: arn:aws:states:::sns:publish
            Parameters:
              TopicArn: "${NotificationTopicArn}"
              Message.$: "States.JsonToString($.notification)"
            Retry:
              - ErrorEquals:
                  - States.TaskFailed
                IntervalSeconds: 10
                MaxAttempts: 3
                BackoffRate: 2.0
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: "$.error"
                Next: SendToDLQ
            Next: InitialWait
          InitialWait:
            Type: Wait
            SecondsPath: "$.delaySeconds"
            Next: FetchStats
          FetchStats:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: "${GetGameStatsFunctionArn}"
              Payload.$: "$"
            OutputPath: "$.Payload"
            Retry:
              - ErrorEquals:
                  - States.TaskFailed
                IntervalSeconds: 60
                MaxAttempts: 8
                BackoffRate: 2.0
                MaxDelaySeconds: 900
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: "$.error"
                Next: SendToDLQ
            End: true
          SendToDLQ:
            Type: Task
            Resource: arn:aws:states:::sqs:sendMessage
            Parameters:
              QueueUrl: "${StatsDeadLetterQueueUrl}"
              MessageBody.$: "States.JsonToString($)"
            Next: StatsFailed
          StatsFailed:
            Type: Fail
            Error: GameStatsCollectionFailed
            Cause: Stats collection failed after retries; payload sent to the stats DLQ

  IsPlayerInGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: is_player_in_game.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          PLAYERS_TABLE_NAME: !Ref PlayersTable
          DYNAMO_TABLE_NAME: !Ref GameStatsTable
          STATE_MACHINE_ARN: !Ref GameLifecycleStateMachine
          RIOT_API_KEY_SECRET_ARN: !Ref RiotApiKeySecretArn
          RIOT_REGION: !Ref RiotRegion
          MATCH_REGION: !Ref MatchRegion
          GAME_STATS_DELAY_SECONDS: "3600"
          STATS_TTL_DAYS: "30"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlayersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameStatsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref RiotApiKeySecretArn
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref GameLifecycleStateMachine
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt DetectionDeadLetterQueue.Arn
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt DetectionDeadLetterQueue.Arn
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: true

  NotifyWebhooksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: notify_webhooks.lambda_handler
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL: !Ref DiscordWebhookUrl
          SES_SENDER_EMAIL: !Ref SesSenderEmail
          RECIPIENT_EMAIL: !Ref RecipientEmail
      Events:
        NotificationTopic:
          Type: SNS
          Properties:
            Topic: !Ref NotificationTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesSenderEmail}"

  GetGameStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: get_game_stats.lambda_handler
      Environment:
        Variables:
          MATCH_REGION: !Ref MatchRegion
          DYNAMO_TABLE_NAME: !Ref GameStatsTable
          RIOT_API_KEY_SECRET_ARN: !Ref RiotApiKeySecretArn
          STATS_TTL_DAYS: "30"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameStatsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref RiotApiKeySecretArn

  DetectionLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The sensor lambda reported errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IsPlayerInGameFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  DetectionDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Messages are visible in the detection dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DetectionDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  StatsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Messages are visible in the stats dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt StatsDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  StateMachineFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The game lifecycle state machine has failed executions.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref GameLifecycleStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
